<script>
(function(){
  try {
    var t = localStorage.getItem('rococo_member_token');
    if (t) {
      var payload = JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      if (payload.exp && Date.now() < payload.exp * 1000) return;
      localStorage.removeItem('rococo_member_token');
    }
  } catch(e) {}
  location.replace('../login/?return=' + encodeURIComponent(location.pathname));
})();
</script>

.r-submit:hover { background: #222; }

.sub-btn { width: 100%; padding: .85rem; background: #fff; color: var(--black); border: 1.5px solid var(--gray-200); border-radius: 12px; font-size: .88rem; font-weight: 700; font-family: inherit; cursor: pointer; }
.sub-btn:hover { border-color: var(--accent); color: var(--accent); }
.danger-btn { width: 100%; padding: .85rem; background: #fff; color: #c0392b; border: 1.5px solid #f0d4d0; border-radius: 12px; font-size: .85rem; font-weight: 700; font-family: inherit; cursor: pointer; }
.danger-btn:hover { background: #fdf3f2; border-color: #c0392b; }

<script src="../../js/main.js"></script>
<script>
var API = 'https://rococo-journal-api.vercel.app/api';
var token = localStorage.getItem('rococo_member_token');

function formatPhone(p) {
  if (!p) return '-';
  var d = String(p).replace(/-/g, '');
  if (d.length === 11) return d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7);
  if (d.length === 10) return d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6);
  return p;
}

var currentMember = null;

function renderMember(m) {
  currentMember = m;
  document.getElementById('acct-username').textContent = m.username || '-';
  document.getElementById('edit-username').textContent = m.username || '-';
  document.getElementById('acct-name').textContent = m.name || '-';
  document.getElementById('acct-phone').textContent = formatPhone(m.phone);
  document.getElementById('acct-email').textContent = m.email || '-';
  document.getElementById('acct-created').textContent = m.created_at ? m.created_at.slice(0, 10).replace(/-/g, '. ') : '-';
  if (m.name) localStorage.setItem('rococo_member_name', m.name);
}

// 회원 정보는 서버에서 조회 (JWT에는 아이디/이름만 들어있음)
fetch(API + '/member?action=me', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
}).then(function (r) { return r.json(); }).then(function (d) {
  if (d.ok && d.member) renderMember(d.member);
}).catch(function () {});

document.getElementById('btn-edit').addEventListener('click', function () {
  if (!currentMember) return;
  document.getElementById('e-name').value = currentMember.name || '';
  document.getElementById('e-phone').value = formatPhone(currentMember.phone);
  document.getElementById('e-email').value = currentMember.email || '';
  document.getElementById('edit-msg').className = 'r-msg';
  document.getElementById('view-mode').hidden = true;
  document.getElementById('edit-mode').hidden = false;
});

document.getElementById('btn-cancel').addEventListener('click', function () {
  document.getElementById('edit-mode').hidden = true;
  document.getElementById('view-mode').hidden = false;
});

document.getElementById('btn-save').addEventListener('click', function () {
  var msg = document.getElementById('edit-msg');
  msg.className = 'r-msg';
  function fail(text) { msg.textContent = text; msg.className = 'r-msg bad show'; }

  var name = document.getElementById('e-name').value.trim();
  var phone = document.getElementById('e-phone').value.trim();
  var email = document.getElementById('e-email').value.trim();

  if (!name) return fail('이름을 입력해주세요.');
  if (!/^01[0-9]-?\d{3,4}-?\d{4}$/.test(phone)) return fail('휴대전화 형식이 올바르지 않습니다.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('이메일 형식이 올바르지 않습니다.');

  var btn = this;
  btn.disabled = true; btn.textContent = '저장 중...';

  fetch(API + '/member?action=update-profile', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ name: name, phone: phone, email: email })
  }).then(function (r) { return r.json().then(function (d) { return { status: r.status, body: d }; }); })
    .then(function (res) {
      btn.disabled = false; btn.textContent = '저장';
      if (res.status !== 200) return fail(res.body.error || '저장 중 오류가 발생했습니다.');
      renderMember({
        username: currentMember.username,
        name: name,
        phone: phone.replace(/-/g, ''),
        email: email.toLowerCase(),
        created_at: currentMember.created_at
      });
      document.getElementById('edit-mode').hidden = true;
      document.getElementById('view-mode').hidden = false;
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = '저장';
      fail('오류: ' + e.message);
    });
});

document.getElementById('btn-change-pw').addEventListener('click', function () {
  var cur = document.getElementById('f-current').value;
  var nw = document.getElementById('f-new').value;
  var nw2 = document.getElementById('f-new2').value;
  var msg = document.getElementById('pw-msg');
  msg.className = 'r-msg';

  function fail(text) { msg.textContent = text; msg.className = 'r-msg bad show'; }

  if (!cur || !nw) return fail('현재 비밀번호와 새 비밀번호를 입력해주세요.');
  if (nw.length < 8) return fail('새 비밀번호는 8자 이상 입력해주세요.');
  if (nw !== nw2) return fail('새 비밀번호가 일치하지 않습니다.');

  var btn = this;
  btn.disabled = true; btn.textContent = '변경 중...';

  fetch(API + '/member?action=change-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ currentPassword: cur, newPassword: nw })
  }).then(function (r) { return r.json().then(function (d) { return { status: r.status, body: d }; }); })
    .then(function (res) {
      btn.disabled = false; btn.textContent = '비밀번호 변경';
      if (res.status !== 200) return fail(res.body.error || '변경 중 오류가 발생했습니다.');
      document.getElementById('f-current').value = '';
      document.getElementById('f-new').value = '';
      document.getElementById('f-new2').value = '';
      msg.textContent = '비밀번호가 변경되었습니다.';
      msg.className = 'r-msg ok show';
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = '비밀번호 변경';
      fail('오류: ' + e.message);
    });
});

document.getElementById('btn-logout').addEventListener('click', function () {
  localStorage.removeItem('rococo_member_token');
  localStorage.removeItem('rococo_member_name');
  location.href = '../../';
});

document.getElementById('btn-delete').addEventListener('click', function () {
  if (!confirm('정말 탈퇴하시겠습니까? 탈퇴 후에는 수술후기 열람을 위해 다시 가입하셔야 합니다.')) return;

  var btn = this;
  btn.disabled = true; btn.textContent = '처리 중...';

  fetch(API + '/member?action=delete-account', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
  }).then(function (r) { return r.json().then(function (d) { return { status: r.status, body: d }; }); })
    .then(function (res) {
      if (res.status !== 200) {
        alert(res.body.error || '탈퇴 처리 중 오류가 발생했습니다.');
        btn.disabled = false; btn.textContent = '회원탈퇴';
        return;
      }
      localStorage.removeItem('rococo_member_token');
      localStorage.removeItem('rococo_member_name');
      alert('탈퇴가 완료되었습니다.');
      location.href = '../../';
    }).catch(function (e) {
      alert('오류: ' + e.message);
      btn.disabled = false; btn.textContent = '회원탈퇴';
    });
});
</script>
</body>
