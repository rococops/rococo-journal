<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 답변 확인 — 로코코성형외과 김상호 원장</title>
<meta name="description" content="온라인 상담 신청 시 입력하신 이름과 비밀번호로 답변을 확인하실 수 있습니다.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://journal.rococops.com/counsel/lookup/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<style>
.lookup-section { padding: 3rem 0 5rem; }
.lookup-wrap { max-width: 560px; margin: 0 auto; }
.rsec { background: #fff; border-radius: 14px; padding: 1.75rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 6px 20px -4px rgba(0,0,0,.08); border: 1px solid rgba(0,0,0,.04); }
.r-group { margin-bottom: 1rem; }
.r-label { display: block; font-size: .8rem; font-weight: 800; color: var(--black); margin-bottom: .45rem; }
.r-input { width: 100%; padding: .75rem 1rem; border: 1.5px solid var(--gray-200); border-radius: 10px; font-size: 16px; font-family: inherit; color: var(--black); background: #fff; }
.r-input:focus { outline: none; border-color: var(--accent); }
.r-submit { width: 100%; padding: 1rem; background: var(--black); color: #fff; border: none; border-radius: 12px; font-size: .95rem; font-weight: 800; font-family: inherit; cursor: pointer; margin-top: .5rem; }
.r-submit:hover { background: #222; }
.r-submit:disabled { background: var(--gray-200); color: var(--gray-400); cursor: not-allowed; }
.r-msg { font-size: .82rem; margin-top: .75rem; display: none; text-align: center; }
.r-msg.show { display: block; }
.r-msg.bad { color: #c0392b; }
.inq-item { border-bottom: 1px solid var(--gray-100); padding: 1.25rem 0; }
.inq-item:last-child { border-bottom: none; }
.inq-meta { font-size: .74rem; color: var(--gray-400); font-weight: 700; margin-bottom: .5rem; display: flex; gap: .5rem; align-items: center; }
.inq-badge { padding: .12rem .5rem; border-radius: 999px; font-size: .68rem; background: var(--gray-100); color: var(--gray-600); }
.inq-badge.answered { background: #eaf5ee; color: #2e7d4f; }
.inq-q { font-size: .88rem; line-height: 1.85; color: var(--black); white-space: pre-wrap; }
.inq-photos { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
.inq-photos span { font-size: .74rem; color: var(--gray-400); }
.inq-reply { margin-top: 1rem; padding: 1rem 1.15rem; background: var(--gray-50); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; }
.inq-reply-label { font-size: .72rem; font-weight: 800; color: var(--accent); letter-spacing: .06em; margin-bottom: .45rem; }
.inq-reply-body { font-size: .86rem; line-height: 1.85; color: var(--gray-600); white-space: pre-wrap; }
.inq-pending { margin-top: .75rem; font-size: .8rem; color: var(--gray-400); }
</style>
</head>
<body>

<div class="gnb-overlay" id="gnbOverlay"></div>
<header class="site-header" id="header">
  <div class="header-inner">
    <a href="../../" class="logo"><span class="logo-main">ROCOCO</span><span class="logo-sub">Journal</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
    <nav class="gnb" id="gnb">
      <div class="gnb-header"><span class="gnb-title">Menu</span><button class="gnb-close" id="gnbClose" aria-label="메뉴 닫기">&#x2715;</button></div>
      <ul>
        <li><a href="../../counsel/" class="btn-consult">상담·예약</a></li>
        <li><a href="../../reviews/" class="btn-gold-outline">수술후기</a></li>
        <li><a href="../../cases/" class="btn-gold">전후사진</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="article-hero">
  <div class="container">
    <div class="article-breadcrumb"><a href="../../">홈</a><span>›</span><a href="../">상담·예약</a><span>›</span><span>상담 답변 확인</span></div>
    <div class="article-hero-inner" style="grid-template-columns:1fr">
      <div class="article-hero-text">
        <h1 class="article-title">상담 답변 확인</h1>
        <p class="article-summary">온라인 상담 신청 시 입력하신 이름과 비밀번호를 입력하시면 답변을 확인하실 수 있습니다. 상담 내용은 본인만 열람 가능합니다.</p>
      </div>
    </div>
  </div>
</section>

<section class="lookup-section">
  <div class="container">
    <div class="lookup-wrap">
      <div class="rsec" id="login-box">
        <div class="r-group">
          <label class="r-label" for="f-name">이름</label>
          <input class="r-input" type="text" id="f-name" autocomplete="name">
        </div>
        <div class="r-group">
          <label class="r-label" for="f-password">비밀번호</label>
          <input class="r-input" type="password" id="f-password">
        </div>
        <p class="r-msg" id="msg"></p>
        <button class="r-submit" id="btn-lookup">답변 확인하기</button>
      </div>

      <div class="rsec" id="result-box" hidden>
        <div id="result-list"></div>
        <button class="r-submit" id="btn-back" style="background:#fff;color:var(--black);border:1.5px solid var(--gray-200)">다시 조회하기</button>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <p>© 2025 Rococo Plastic Surgery. All rights reserved.</p>
    </div>
  </div>
</footer>
<script src="../../js/main.js"></script>
<script>
var API = 'https://rococo-journal-api.vercel.app/api/consult';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function doLookup() {
  var name = document.getElementById('f-name').value.trim();
  var password = document.getElementById('f-password').value;
  var msg = document.getElementById('msg');
  msg.className = 'r-msg';
  if (!name || !password) {
    msg.textContent = '이름과 비밀번호를 입력해주세요.';
    msg.className = 'r-msg bad show';
    return;
  }

  var btn = document.getElementById('btn-lookup');
  btn.disabled = true; btn.textContent = '조회 중...';

  fetch(API + '?action=lookup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, password: password })
  }).then(function (r) { return r.json().then(function (d) { return { status: r.status, body: d }; }); })
    .then(function (res) {
      btn.disabled = false; btn.textContent = '답변 확인하기';
      if (res.status !== 200) {
        msg.textContent = res.body.error || '조회 중 오류가 발생했습니다.';
        msg.className = 'r-msg bad show';
        return;
      }
      render(res.body.inquiries || []);
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = '답변 확인하기';
      msg.textContent = '오류: ' + e.message;
      msg.className = 'r-msg bad show';
    });
}

function render(list) {
  var html = list.map(function (q) {
    var answered = !!q.reply;
    var photos = Array.isArray(q.photos) ? q.photos.length : 0;
    return '<div class="inq-item">'
      + '<div class="inq-meta"><span>' + (q.created_at || '').slice(0,10) + '</span>'
      + '<span class="inq-badge' + (answered ? ' answered' : '') + '">' + (answered ? '답변 완료' : '답변 준비중') + '</span></div>'
      + '<div class="inq-q">' + esc(q.message) + '</div>'
      + (photos ? '<div class="inq-photos"><span>첨부 사진 ' + photos + '장 (원장님·담당자만 열람)</span></div>' : '')
      + (answered
          ? '<div class="inq-reply"><p class="inq-reply-label">로코코성형외과 답변</p><div class="inq-reply-body">' + esc(q.reply) + '</div></div>'
          : '<p class="inq-pending">아직 답변이 등록되지 않았습니다. 답변이 등록되면 신청하신 연락 방법으로도 안내드립니다.</p>')
      + '</div>';
  }).join('');

  document.getElementById('result-list').innerHTML = html;
  document.getElementById('login-box').hidden = true;
  document.getElementById('result-box').hidden = false;
}

document.getElementById('btn-lookup').addEventListener('click', doLookup);
document.getElementById('f-password').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLookup(); });
document.getElementById('btn-back').addEventListener('click', function () {
  document.getElementById('f-password').value = '';
  document.getElementById('result-box').hidden = true;
  document.getElementById('login-box').hidden = false;
});
</script>
</body>
</html>
