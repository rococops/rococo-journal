<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 상담 확인 — 로코코성형외과 김상호 원장</title>
<meta name="description" content="신청하신 온라인 상담의 답변을 확인하실 수 있습니다. 상담 내용은 본인만 열람 가능합니다.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://journal.rococops.com/counsel/board/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<style>
.board-section { padding: 3rem 0 5rem; }
.board-wrap { max-width: 640px; margin: 0 auto; }
.rsec { background: #fff; border-radius: 14px; padding: 1.75rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 6px 20px -4px rgba(0,0,0,.08); border: 1px solid rgba(0,0,0,.04); }
.r-group { margin-bottom: 1rem; }
.r-label { display: block; font-size: .8rem; font-weight: 800; color: var(--black); margin-bottom: .45rem; }
.r-input { width: 100%; padding: .75rem 1rem; border: 1.5px solid var(--gray-200); border-radius: 10px; font-size: 16px; font-family: inherit; color: var(--black); }
.r-input:focus { outline: none; border-color: var(--accent); }
.r-submit { width: 100%; padding: 1rem; background: var(--black); color: #fff; border: none; border-radius: 12px; font-size: .95rem; font-weight: 800; font-family: inherit; cursor: pointer; margin-top: .5rem; }
.r-submit:hover { background: #222; }
.r-submit:disabled { background: var(--gray-200); color: var(--gray-400); cursor: not-allowed; }
.r-msg { font-size: .82rem; margin-top: .75rem; display: none; text-align: center; color: #c0392b; }
.r-msg.show { display: block; }
.guest-help { font-size: .78rem; color: var(--gray-400); line-height: 1.7; margin-top: 1.1rem; padding-top: 1.1rem; border-top: 1px solid var(--gray-100); text-align: center; }
.guest-help a { color: var(--accent); font-weight: 700; text-decoration: underline; }

.my-list { display: flex; flex-direction: column; }
.my-item { display: flex; align-items: center; gap: .75rem; padding: 1rem .25rem; border-bottom: 1px solid var(--gray-100); cursor: pointer; text-align: left; background: none; border-left: none; border-right: none; border-top: none; width: 100%; font-family: inherit; }
.my-item:last-child { border-bottom: none; }
.my-item:hover { background: var(--gray-50); }
.my-item-body { flex: 1; min-width: 0; }
.my-item-title { font-size: .9rem; font-weight: 700; color: var(--black); margin-bottom: .25rem; }
.my-item-date { font-size: .75rem; color: var(--gray-400); }
.b-badge { font-size: .68rem; font-weight: 800; padding: .18rem .55rem; border-radius: 999px; background: var(--gray-100); color: var(--gray-600); white-space: nowrap; }
.b-badge.answered { background: #eaf5ee; color: #2e7d4f; }

.post-head { border-bottom: 1px solid var(--gray-200); padding-bottom: 1.1rem; margin-bottom: 1.25rem; }
.post-title { font-size: 1.15rem; font-weight: 800; color: var(--black); margin-bottom: .5rem; }
.post-meta { font-size: .78rem; color: var(--gray-400); }
.post-body { font-size: .9rem; line-height: 1.9; color: var(--black); white-space: pre-wrap; }
.post-photos { font-size: .8rem; color: var(--gray-400); margin-top: 1rem; }
.post-reply { margin-top: 1.75rem; padding: 1.25rem 1.4rem; background: var(--gray-50); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; }
.post-reply-label { font-size: .74rem; font-weight: 800; color: var(--accent); letter-spacing: .06em; margin-bottom: .55rem; }
.post-reply-body { font-size: .88rem; line-height: 1.9; color: var(--gray-600); white-space: pre-wrap; }
.post-pending { margin-top: 1.5rem; font-size: .85rem; color: var(--gray-400); padding: 1rem; background: var(--gray-50); border-radius: 10px; line-height: 1.7; }
.back-btn { display: inline-block; margin-top: 1.75rem; padding: .7rem 1.5rem; border: 1.5px solid var(--gray-200); border-radius: 10px; font-size: .84rem; font-weight: 700; color: var(--gray-600); cursor: pointer; background: #fff; font-family: inherit; }
.back-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<div class="gnb-overlay" id="gnbOverlay"></div>
<header class="site-header" id="header">
  <div class="header-inner">
    <a href="../../" class="logo"><span class="logo-main">ROCOCO</span><span class="logo-sub">Journal</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
    <nav class="gnb" id="gnb">
      <div class="gnb-header"><span class="gnb-title">Menu</span><button class="gnb-close" id="gnbClose" aria-label="메뉴 닫기">&#x2715;</button></div>
      <ul>
        <li class="has-sub"><a href="../../counsel/" class="btn-consult">상담·예약</a>
          <ul class="sub-menu">
            <li><a href="../../counsel/online/">온라인 상담</a></li>
            <li><a href="../../reserve/">예약 신청</a></li>
            <li><a href="../../counsel/board/">내 상담 확인</a></li>
          </ul>
        </li>
        <li><a href="../../reviews/" class="btn-gold-outline">수술후기</a></li>
        <li><a href="../../cases/" class="btn-gold">전후사진</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="article-hero">
  <div class="container">
    <div class="article-breadcrumb"><a href="../../">홈</a><span>›</span><a href="../">상담·예약</a><span>›</span><span>내 상담 확인</span></div>
    <div class="article-hero-inner" style="grid-template-columns:1fr">
      <div class="article-hero-text">
        <h1 class="article-title">내 상담 확인</h1>
        <p class="article-summary">신청하신 상담의 답변을 확인하실 수 있습니다. 상담 내용과 답변은 본인만 열람 가능합니다.</p>
      </div>
    </div>
  </div>
</section>

<section class="board-section">
  <div class="container">
    <div class="board-wrap">

      <!-- 비회원: 이름 + 비밀번호로 본인 글 찾기 -->
      <div class="rsec" id="search-view">
        <div class="r-group">
          <label class="r-label" for="f-name">이름</label>
          <input class="r-input" type="text" id="f-name" autocomplete="name" placeholder="상담 신청 시 입력하신 이름">
        </div>
        <div class="r-group">
          <label class="r-label" for="f-password">비밀번호</label>
          <input class="r-input" type="password" id="f-password" placeholder="상담 신청 시 설정하신 비밀번호">
        </div>
        <p class="r-msg" id="search-msg"></p>
        <button class="r-submit" id="btn-search">내 상담 찾기</button>
        <p class="guest-help">
          회원으로 로그인하시면 비밀번호 없이 바로 확인하실 수 있습니다.<br>
          <a href="../../member/login/?return=%2Fcounsel%2Fboard%2F">로그인</a> · <a href="../online/">상담 신청하기</a>
        </p>
      </div>

      <!-- 내 상담 목록 -->
      <div class="rsec" id="list-view" hidden>
        <div class="my-list" id="my-list"></div>
        <p class="guest-help"><a href="../online/">새 상담 신청하기</a></p>
      </div>

      <!-- 글 상세 -->
      <div class="rsec" id="post-view" hidden>
        <div class="post-head">
          <h2 class="post-title" id="post-title"></h2>
          <div class="post-meta" id="post-date"></div>
        </div>
        <div class="post-body" id="post-body"></div>
        <div class="post-photos" id="post-photos" hidden></div>
        <div id="post-reply-wrap"></div>
        <button class="back-btn" id="back-btn">← 목록으로</button>
      </div>

    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <p>© 2025 Rococo Plastic Surgery. All rights reserved.</p>
    </div>
  </div>
</footer>
<script src="../../js/main.js"></script>
<script>
var API = 'https://rococo-journal-api.vercel.app/api/consult';
var guestAuth = null;   // 비회원이 입력한 이름/비밀번호 (글 열람 시 재사용)

var memberToken = (function () {
  try {
    var t = localStorage.getItem('rococo_member_token');
    if (!t) return null;
    var payload = JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    return (payload.exp && Date.now() < payload.exp * 1000) ? t : null;
  } catch (e) { return null; }
})();

function headers() {
  var h = { 'Content-Type': 'application/json' };
  if (memberToken) h['Authorization'] = 'Bearer ' + memberToken;
  return h;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function show(view) {
  ['search-view', 'list-view', 'post-view'].forEach(function (id) {
    document.getElementById(id).hidden = (id !== view);
  });
}

function loadMyList(body) {
  var msg = document.getElementById('search-msg');
  msg.className = 'r-msg';
  var btn = document.getElementById('btn-search');
  if (btn) { btn.disabled = true; btn.textContent = '조회 중...'; }

  fetch(API + '?action=list', { method:'POST', headers: headers(), body: JSON.stringify(body || {}) })
    .then(function (r) { return r.json().then(function (d) { return { status: r.status, body: d }; }); })
    .then(function (res) {
      if (btn) { btn.disabled = false; btn.textContent = '내 상담 찾기'; }
      if (res.status !== 200) {
        if (!memberToken) {
          msg.textContent = res.body.error || '조회 중 오류가 발생했습니다.';
          msg.className = 'r-msg show';
        }
        return;
      }
      renderList(res.body.inquiries || []);
    }).catch(function (e) {
      if (btn) { btn.disabled = false; btn.textContent = '내 상담 찾기'; }
      msg.textContent = '오류: ' + e.message;
      msg.className = 'r-msg show';
    });
}

function renderList(list) {
  if (!list.length) {
    document.getElementById('my-list').innerHTML = '<p style="text-align:center;color:var(--gray-400);font-size:.88rem;padding:2rem 0">신청하신 상담 내역이 없습니다.</p>';
  } else {
    document.getElementById('my-list').innerHTML = list.map(function (q) {
      return '<button type="button" class="my-item" data-id="' + esc(q.id) + '">'
        + '<div class="my-item-body">'
        + '<div class="my-item-title">' + esc(q.title) + '</div>'
        + '<div class="my-item-date">' + (q.created_at || '').slice(0,10) + '</div>'
        + '</div>'
        + '<span class="b-badge' + (q.answered ? ' answered' : '') + '">' + (q.answered ? '답변완료' : '답변대기') + '</span>'
        + '</button>';
    }).join('');

    document.querySelectorAll('.my-item').forEach(function (el) {
      el.addEventListener('click', function () { openPost(el.dataset.id); });
    });
  }
  show('list-view');
}

function openPost(id) {
  var body = { id: id };
  if (!memberToken && guestAuth) body.password = guestAuth.password;

  fetch(API + '?action=view', { method:'POST', headers: headers(), body: JSON.stringify(body) })
    .then(function (r) { return r.json().then(function (d) { return { status: r.status, body: d }; }); })
    .then(function (res) {
      if (res.status !== 200) { alert(res.body.error || '열람할 수 없습니다.'); return; }
      renderPost(res.body.inquiry);
    }).catch(function (e) { alert('오류: ' + e.message); });
}

function renderPost(q) {
  document.getElementById('post-title').textContent = q.title || '상담 문의';
  document.getElementById('post-date').textContent = (q.created_at || '').slice(0, 10);
  document.getElementById('post-body').textContent = q.message || '';

  var photos = document.getElementById('post-photos');
  if (q.photo_count) {
    photos.textContent = '첨부하신 사진 ' + q.photo_count + '장 — 원장님과 담당자만 열람합니다.';
    photos.hidden = false;
  } else photos.hidden = true;

  document.getElementById('post-reply-wrap').innerHTML = q.reply
    ? '<div class="post-reply"><p class="post-reply-label">로코코성형외과 답변</p><div class="post-reply-body">' + esc(q.reply) + '</div></div>'
    : '<p class="post-pending">아직 답변이 등록되지 않았습니다.<br>답변이 등록되면 신청하신 연락 방법(전화·카카오톡·이메일)으로도 안내드립니다.</p>';

  show('post-view');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('btn-search').addEventListener('click', function () {
  var name = document.getElementById('f-name').value.trim();
  var password = document.getElementById('f-password').value;
  if (!name || !password) {
    var msg = document.getElementById('search-msg');
    msg.textContent = '이름과 비밀번호를 입력해주세요.';
    msg.className = 'r-msg show';
    return;
  }
  guestAuth = { name: name, password: password };
  loadMyList(guestAuth);
});
document.getElementById('f-password').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('btn-search').click();
});
document.getElementById('back-btn').addEventListener('click', function () { show('list-view'); });

// 로그인 회원은 입력 없이 바로 내 상담 목록
if (memberToken) loadMyList({});
</script>
</body>
</html>
