<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 게시판 — 로코코성형외과 김상호 원장</title>
<meta name="description" content="온라인 상담 문의와 답변을 확인하실 수 있습니다. 상담 내용은 작성자 본인만 열람 가능합니다.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://journal.rococops.com/counsel/board/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<style>
.board-section { padding: 3rem 0 5rem; }
.board-wrap { max-width: 760px; margin: 0 auto; }
.board-table { width: 100%; border-collapse: collapse; font-size: .86rem; }
.board-table th {
  text-align: left; padding: .7rem .6rem; border-bottom: 2px solid var(--gray-200);
  font-size: .72rem; font-weight: 800; color: var(--gray-400); letter-spacing: .06em;
}
.board-table td { padding: .85rem .6rem; border-bottom: 1px solid var(--gray-100); vertical-align: middle; }
.board-table tr.clickable { cursor: pointer; }
.board-table tr.clickable:hover td { background: var(--gray-50); }
.b-title { font-weight: 700; color: var(--black); display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.b-lock { font-size: .78rem; color: var(--gray-400); }
.b-badge { font-size: .68rem; font-weight: 800; padding: .12rem .5rem; border-radius: 999px; background: var(--gray-100); color: var(--gray-600); }
.b-badge.answered { background: #eaf5ee; color: #2e7d4f; }
.b-badge.mine { background: #fdf4ea; color: var(--accent); }
.b-name, .b-date { color: var(--gray-400); font-size: .8rem; white-space: nowrap; }
.board-empty { text-align: center; color: var(--gray-400); font-size: .88rem; padding: 3rem 0; }
.board-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; flex-wrap: wrap; }
.page-btns { display: flex; gap: .35rem; }
.page-btn { padding: .4rem .75rem; border: 1.5px solid var(--gray-200); border-radius: 8px; background: #fff; font-size: .8rem; font-weight: 700; color: var(--gray-600); cursor: pointer; font-family: inherit; }
.page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.page-btn:disabled { opacity: .4; cursor: default; }
.write-btn { padding: .65rem 1.5rem; background: var(--black); color: #fff; border-radius: 10px; font-size: .85rem; font-weight: 800; }
.write-btn:hover { background: #222; }

/* 비밀번호 모달 */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 1.25rem; }
.modal-bg.open { display: flex; }
.modal { background: #fff; border-radius: 14px; padding: 1.75rem; max-width: 380px; width: 100%; }
.modal h3 { font-size: 1rem; font-weight: 800; margin-bottom: .4rem; }
.modal p { font-size: .8rem; color: var(--gray-600); line-height: 1.7; margin-bottom: 1.1rem; }
.modal input { width: 100%; padding: .75rem 1rem; border: 1.5px solid var(--gray-200); border-radius: 10px; font-size: 16px; font-family: inherit; }
.modal input:focus { outline: none; border-color: var(--accent); }
.modal-msg { font-size: .78rem; color: #c0392b; margin-top: .5rem; display: none; }
.modal-msg.show { display: block; }
.modal-btns { display: flex; gap: .5rem; margin-top: 1.1rem; }
.modal-btns button { flex: 1; padding: .8rem; border-radius: 10px; font-size: .85rem; font-weight: 800; font-family: inherit; cursor: pointer; border: none; }
.modal-ok { background: var(--black); color: #fff; }
.modal-cancel { background: #fff; color: var(--gray-600); border: 1.5px solid var(--gray-200) !important; }

/* 글 상세 */
.post-head { border-bottom: 1px solid var(--gray-200); padding-bottom: 1.1rem; margin-bottom: 1.25rem; }
.post-title { font-size: 1.15rem; font-weight: 800; color: var(--black); margin-bottom: .5rem; }
.post-meta { font-size: .78rem; color: var(--gray-400); display: flex; gap: .6rem; }
.post-body { font-size: .9rem; line-height: 1.9; color: var(--black); white-space: pre-wrap; }
.post-photos { font-size: .8rem; color: var(--gray-400); margin-top: 1rem; }
.post-reply { margin-top: 1.75rem; padding: 1.25rem 1.4rem; background: var(--gray-50); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; }
.post-reply-label { font-size: .74rem; font-weight: 800; color: var(--accent); letter-spacing: .06em; margin-bottom: .55rem; }
.post-reply-body { font-size: .88rem; line-height: 1.9; color: var(--gray-600); white-space: pre-wrap; }
.post-pending { margin-top: 1.5rem; font-size: .85rem; color: var(--gray-400); padding: 1rem; background: var(--gray-50); border-radius: 10px; }
.back-btn { display: inline-block; margin-top: 1.75rem; padding: .7rem 1.5rem; border: 1.5px solid var(--gray-200); border-radius: 10px; font-size: .84rem; font-weight: 700; color: var(--gray-600); cursor: pointer; background: #fff; font-family: inherit; }
.back-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<div class="gnb-overlay" id="gnbOverlay"></div>
<header class="site-header" id="header">
  <div class="header-inner">
    <a href="../../" class="logo"><span class="logo-main">ROCOCO</span><span class="logo-sub">Journal</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
    <nav class="gnb" id="gnb">
      <div class="gnb-header"><span class="gnb-title">Menu</span><button class="gnb-close" id="gnbClose" aria-label="메뉴 닫기">&#x2715;</button></div>
      <ul>
        <li><a href="../../counsel/" class="btn-consult">상담·예약</a></li>
        <li><a href="../../reviews/" class="btn-gold-outline">수술후기</a></li>
        <li><a href="../../cases/" class="btn-gold">전후사진</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="article-hero">
  <div class="container">
    <div class="article-breadcrumb"><a href="../../">홈</a><span>›</span><a href="../">상담·예약</a><span>›</span><span>상담 게시판</span></div>
    <div class="article-hero-inner" style="grid-template-columns:1fr">
      <div class="article-hero-text">
        <h1 class="article-title">상담 게시판</h1>
        <p class="article-summary">상담 내용과 답변은 작성자 본인만 열람하실 수 있습니다. 글을 선택하신 뒤 작성 시 설정한 비밀번호를 입력해주세요. 회원으로 로그인하신 경우 본인 글은 비밀번호 없이 바로 열람됩니다.</p>
      </div>
    </div>
  </div>
</section>

<section class="board-section">
  <div class="container">
    <div class="board-wrap">
      <div id="list-view">
        <div id="board-list"><p class="board-empty">불러오는 중...</p></div>
        <div class="board-foot">
          <div class="page-btns">
            <button class="page-btn" id="prev-btn" disabled>← 이전</button>
            <button class="page-btn" id="next-btn" disabled>다음 →</button>
          </div>
          <a href="../online/" class="write-btn">상담 글쓰기</a>
        </div>
      </div>

      <div id="post-view" hidden>
        <div class="post-head">
          <h2 class="post-title" id="post-title"></h2>
          <div class="post-meta">
            <span id="post-name"></span><span id="post-date"></span>
          </div>
        </div>
        <div class="post-body" id="post-body"></div>
        <div class="post-photos" id="post-photos" hidden></div>
        <div id="post-reply-wrap"></div>
        <button class="back-btn" id="back-btn">← 목록으로</button>
      </div>
    </div>
  </div>
</section>

<div class="modal-bg" id="pw-modal">
  <div class="modal">
    <h3>비밀번호 확인</h3>
    <p>작성 시 설정하신 비밀번호를 입력해주세요.</p>
    <input type="password" id="pw-input" placeholder="비밀번호">
    <p class="modal-msg" id="pw-msg"></p>
    <div class="modal-btns">
      <button class="modal-cancel" id="pw-cancel">취소</button>
      <button class="modal-ok" id="pw-ok">확인</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <p>© 2025 Rococo Plastic Surgery. All rights reserved.</p>
    </div>
  </div>
</footer>
<script src="../../js/main.js"></script>
<script>
var API = 'https://rococo-journal-api.vercel.app/api/consult';
var page = 1, totalPages = 1, pendingId = null;

// 로그인 회원이면 토큰을 함께 보내 본인 글은 비밀번호 없이 열람
var memberToken = (function () {
  try {
    var t = localStorage.getItem('rococo_member_token');
    if (!t) return null;
    var payload = JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    return (payload.exp && Date.now() < payload.exp * 1000) ? t : null;
  } catch (e) { return null; }
})();

function headers() {
  var h = { 'Content-Type': 'application/json' };
  if (memberToken) h['Authorization'] = 'Bearer ' + memberToken;
  return h;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function loadList() {
  var wrap = document.getElementById('board-list');
  wrap.innerHTML = '<p class="board-empty">불러오는 중...</p>';
  fetch(API + '?action=list', { method:'POST', headers: headers(), body: JSON.stringify({ page: page }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) { wrap.innerHTML = '<p class="board-empty">' + esc(d.error || '불러오기 실패') + '</p>'; return; }
      var list = d.inquiries || [];
      totalPages = Math.max(1, Math.ceil((d.total || 0) / (d.size || 15)));
      if (!list.length) { wrap.innerHTML = '<p class="board-empty">등록된 상담 글이 없습니다.</p>'; }
      else {
        wrap.innerHTML = '<table class="board-table"><thead><tr>'
          + '<th>제목</th><th style="width:90px">작성자</th><th style="width:100px">작성일</th>'
          + '</tr></thead><tbody>'
          + list.map(function (q) {
              return '<tr class="clickable" data-id="' + esc(q.id) + '" data-mine="' + (q.mine ? '1' : '') + '">'
                + '<td><div class="b-title"><span class="b-lock">🔒</span>' + esc(q.title)
                + (q.mine ? '<span class="b-badge mine">내 글</span>' : '')
                + '<span class="b-badge' + (q.answered ? ' answered' : '') + '">' + (q.answered ? '답변완료' : '답변대기') + '</span>'
                + '</div></td>'
                + '<td class="b-name">' + esc(q.name) + '</td>'
                + '<td class="b-date">' + (q.created_at || '').slice(0,10) + '</td>'
                + '</tr>';
            }).join('')
          + '</tbody></table>';

        wrap.querySelectorAll('tr.clickable').forEach(function (tr) {
          tr.addEventListener('click', function () {
            var id = tr.dataset.id;
            if (tr.dataset.mine) openPost(id, null);   // 로그인 본인 글 — 비밀번호 불필요
            else askPassword(id);
          });
        });
      }
      document.getElementById('prev-btn').disabled = page <= 1;
      document.getElementById('next-btn').disabled = page >= totalPages;
    }).catch(function (e) {
      wrap.innerHTML = '<p class="board-empty">오류: ' + esc(e.message) + '</p>';
    });
}

function askPassword(id) {
  pendingId = id;
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-msg').className = 'modal-msg';
  document.getElementById('pw-modal').classList.add('open');
  document.getElementById('pw-input').focus();
}

function closeModal() {
  document.getElementById('pw-modal').classList.remove('open');
  pendingId = null;
}

function openPost(id, password) {
  var msg = document.getElementById('pw-msg');
  fetch(API + '?action=view', {
    method: 'POST', headers: headers(),
    body: JSON.stringify({ id: id, password: password })
  }).then(function (r) { return r.json().then(function (d) { return { status: r.status, body: d }; }); })
    .then(function (res) {
      if (res.status !== 200) {
        if (password !== null) {
          msg.textContent = res.body.error || '열람할 수 없습니다.';
          msg.className = 'modal-msg show';
        } else {
          alert(res.body.error || '열람할 수 없습니다.');
        }
        return;
      }
      closeModal();
      renderPost(res.body.inquiry);
    }).catch(function (e) {
      msg.textContent = '오류: ' + e.message;
      msg.className = 'modal-msg show';
    });
}

function renderPost(q) {
  document.getElementById('post-title').textContent = q.title || '상담 문의';
  document.getElementById('post-name').textContent = q.name + '님';
  document.getElementById('post-date').textContent = (q.created_at || '').slice(0, 10);
  document.getElementById('post-body').textContent = q.message || '';

  var photos = document.getElementById('post-photos');
  if (q.photo_count) {
    photos.textContent = '첨부 사진 ' + q.photo_count + '장 — 원장님과 담당자만 열람합니다.';
    photos.hidden = false;
  } else photos.hidden = true;

  document.getElementById('post-reply-wrap').innerHTML = q.reply
    ? '<div class="post-reply"><p class="post-reply-label">로코코성형외과 답변</p><div class="post-reply-body">' + esc(q.reply) + '</div></div>'
    : '<p class="post-pending">아직 답변이 등록되지 않았습니다. 답변이 등록되면 신청하신 연락 방법으로도 안내드립니다.</p>';

  document.getElementById('list-view').hidden = true;
  document.getElementById('post-view').hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('pw-ok').addEventListener('click', function () {
  var pw = document.getElementById('pw-input').value;
  if (!pw) return;
  openPost(pendingId, pw);
});
document.getElementById('pw-input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('pw-ok').click();
});
document.getElementById('pw-cancel').addEventListener('click', closeModal);
document.getElementById('pw-modal').addEventListener('click', function (e) {
  if (e.target === this) closeModal();
});
document.getElementById('back-btn').addEventListener('click', function () {
  document.getElementById('post-view').hidden = true;
  document.getElementById('list-view').hidden = false;
});
document.getElementById('prev-btn').addEventListener('click', function () { if (page > 1) { page--; loadList(); } });
document.getElementById('next-btn').addEventListener('click', function () { if (page < totalPages) { page++; loadList(); } });

loadList();
</script>
</body>
</html>
