# GitHub Pages 배포가 끝난 뒤 실행.
# - 배포 실패: 한 번 자동으로 다시 배포 (빈 커밋으로 재배포하던 수작업 대체)
# - 배포 성공: 바뀐 페이지 주소를 IndexNow 로 네이버·빙에 알림
name: after-deploy
on:
  workflow_run:
    workflows: ['pages-build-deployment', 'pages build and deployment']
    types: [completed]
permissions:
  contents: read
  actions: write
  pages: write
jobs:
  retry:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 2 }}
    runs-on: ubuntu-latest
    steps:
      - name: 실패한 배포 한 번 재시도
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs" \
            || gh api -X POST "repos/${{ github.repository }}/pages/builds"
  indexnow:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: 바뀐 주소 알림
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # 직전에 성공한 배포의 커밋을 찾아 그 사이에 바뀐 페이지만 보낸다
          PREV=$(gh api "repos/${{ github.repository }}/actions/workflows/${{ github.event.workflow_run.workflow_id }}/runs?status=success&per_page=10" \
            --jq "[.workflow_runs[] | select(.head_sha != \"$HEAD_SHA\")][0].head_sha")
          if [ -z "$PREV" ] || ! git cat-file -e "$PREV" 2>/dev/null; then PREV="$HEAD_SHA~1"; fi
          python3 tools/indexnow_ping.py "$PREV" "$HEAD_SHA"
